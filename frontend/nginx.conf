# Serves the built app (dist/) inside the frontend container. HTTPS and the
# routing of /api and /socket.io to the backend happen in the proxy in front.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built files have a hash of their content in their name: a new version
    # gets a new name, so browsers can keep these for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other path is a page of the app (/chat/lina, /tournaments/...):
    # answer with index.html and let the app's router show the page.
    # index.html is checked again on every visit, so a new version shows up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
