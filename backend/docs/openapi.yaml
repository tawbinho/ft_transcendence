# Connect Four API: the TARGET design (existing backend + what the frontend needs).
# Generated from frontend/docs/api-contract.md and frontend/src/features/*/types.ts, checked against the
# real backend. Edit this file by hand from now on. Read `info.description` first.
# Open it in https://editor.swagger.io (paste the file) or any OpenAPI viewer.
openapi: 3.0.3
info:
  title: Connect Four API (target design)
  version: 0.2.0
  description: |
    The TARGET API of the Connect Four app: what the backend already does plus what the frontend needs.

    **How this file was made.** From `frontend/docs/api-contract.md` and the TypeScript types in `frontend/src/features/*/types.ts` (the app is compiled against them),
    checked against the real backend routes. It is a DESIGN: the backend implements it step by step. The Swagger page served by the running backend (`/api/docs`,
    generated from the code) shows what exists today.

    **Status of each route** (`x-status`):
    - `implemented`: the backend already does this, exactly as written (checked with real requests).
    - `change`: exists, but must change (only `GET /matches/{id}`: spectators may read a match).
    - `new`: does not exist yet. The frontend answers it with its in-browser demo server (`x-demo-feature` names the feature switch `VITE_DEMO_FEATURES`).

    **Conventions** (the existing backend already follows these; the new routes keep them)
    - Every route is under `/api`, on the same origin as the app (an HTTPS proxy sends `/api` and `/socket.io` to the backend, everything else to the frontend).
    - Login is the httpOnly `session` cookie. Every route needs it except signup, login, 2FA verify, logout and `GET /auth/me`. Without a valid session: `401 UNAUTHORIZED`.
    - Success: any 2xx with `{ "data": ... }` (`{ "data": null }` when there is nothing to return). Failure: `{ "error": { "code", "message" } }`.
    - A body or query that breaks a rule: `400 VALIDATION_ERROR`. An id in a path that is not a UUID is `VALIDATION_ERROR` too.
    - Ids are UUID strings. Dates are ISO 8601 in UTC.
    - Long lists take `limit` (1 to 50, default 20) and `offset` (default 0) and answer `{ items, total, limit, offset }`.
    - Rate limit: 100 requests a minute per client address and per route; less on signup (5), login (10), 2FA (5) and creating a match (20). Over: `429 RATE_LIMITED`.
    - Online presence: a player is online while they have the app open. With sockets: at least one open socket. Before sockets exist: a request in the last minute (the app sends one at least every 30 s while a tab is visible).

    **Not in this document:** the real-time events are described under the `x-realtime` extension at the top level (OpenAPI cannot describe sockets).
servers:
- url: https://localhost:{port}/api
  description: Local, behind the HTTPS proxy (self-signed certificate)
  variables:
    port:
      default: '8443'
      description: HTTPS_PORT of the root .env
tags:
- name: auth
  description: Accounts, login, two-factor authentication. All implemented.
- name: matches
  description: Online games, with spectator mode (`live`, and `GET /matches/{id}` open to every logged-in user). All implemented.
- name: users
  description: Player search, profiles, display name and avatar. All implemented.
- name: friends
  description: Friend requests and friends. Implemented (the `friends:update` socket event waits for the WebSockets gateway).
- name: chat
  description: Private messages, match invitations, read receipts, typing, and blocking. Blocking is implemented; the rest is new (demo feature `chat`).
- name: tournaments
  description: 'Online single-elimination tournaments with 4 or 8 places. All implemented: list, create, read, cancel,
    join, leave, start, the bracket and advancing winners. Not built yet: the chat message that tells a player their match
    is ready (it waits for chat).'
security:
- session: []
paths:
  /auth/signup:
    post:
      tags:
      - auth
      operationId: signup
      summary: Create an account and log in
      description: 'Sets the `session` cookie. Rate limit: 5 per minute.'
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created, logged in
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: 'Codes: `EMAIL_TAKEN`, `DISPLAY_NAME_TAKEN`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: EMAIL_TAKEN
                  message: See the error code table
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags:
      - auth
      operationId: login
      summary: Log in with email and password
      description: 'Without 2FA: sets the `session` cookie and returns the user. With 2FA on: sets a PENDING session
        (5 minutes) that only works for `/auth/2fa/verify`, and answers `{ user: null, twoFactorRequired: true }`.
        Wrong email and wrong password give the same error. Rate limit: 10 per minute.'
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in, or a 2FA code is needed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 'Codes: `INVALID_CREDENTIALS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: See the error code table
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/2fa/verify:
    post:
      tags:
      - auth
      operationId: verifyTwoFactor
      summary: Finish a login with the 6-digit code
      description: 'Needs the pending session cookie from `/auth/login`. The code can be the 6 digits of the app or a one-time backup code (it is spent when used). On success the cookie is replaced by a
        new full session. A code cannot be used twice. Rate limit: 5 per minute.'
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorOrBackupCodeRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SessionResult'
        '400':
          description: 'INVALID_2FA_CODE: wrong, expired or already used code. Codes: `VALIDATION_ERROR`, `INVALID_2FA_CODE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: See the error code table
        '401':
          description: 'No pending session: log in with the password first. Codes: `UNAUTHORIZED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: See the error code table
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: Log out
      description: Deletes the session on the server (immediately) and clears the cookie. Works even when nobody
        is logged in.
      x-status: implemented
      security: []
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    nullable: true
                    description: Always null
                    example: null
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/me:
    get:
      tags:
      - auth
      operationId: me
      summary: The logged-in user, or null
      description: 'Never answers 401: nobody logged in is a normal answer (`data: null`), so a visit by a logged-out
        user does not print an error in the browser console. A pending 2FA session also answers null.'
      x-status: implemented
      security: []
      responses:
        '200':
          description: The user, or null
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    nullable: true
                    allOf:
                    - $ref: '#/components/schemas/User'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/2fa/setup:
    post:
      tags:
      - auth
      operationId: setupTwoFactor
      summary: Start the 2FA setup
      description: Creates a secret (stored encrypted, not active yet) and returns the QR code. Call again before
        enabling to replace it.
      x-status: implemented
      responses:
        '200':
          description: Scan the QR code
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TwoFactorSetup'
        '409':
          description: 'Codes: `TWO_FACTOR_ALREADY_ENABLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TWO_FACTOR_ALREADY_ENABLED
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/2fa/enable:
    post:
      tags:
      - auth
      operationId: enableTwoFactor
      summary: Turn 2FA on
      description: The first valid code from the authenticator app activates 2FA, and the answer holds the 10 backup codes (shown ONLY this once, so the app must tell the user to keep them safe). Only the 6-digit code works here.
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
      responses:
        '200':
          description: 2FA is on
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/BackupCodes'
        '400':
          description: 'Codes: `VALIDATION_ERROR`, `INVALID_2FA_CODE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: See the error code table
        '409':
          description: 'Call setup first. Codes: `TWO_FACTOR_NOT_PENDING`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TWO_FACTOR_NOT_PENDING
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/2fa/disable:
    post:
      tags:
      - auth
      operationId: disableTwoFactor
      summary: Turn 2FA off
      description: Needs a valid code, so a stolen session cannot remove the protection. The code can be the 6 digits of the app or a one-time backup code (it is spent when used).
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorOrBackupCodeRequest'
      responses:
        '200':
          description: 2FA is off
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    nullable: true
                    description: Always null
                    example: null
        '400':
          description: 'Codes: `VALIDATION_ERROR`, `INVALID_2FA_CODE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: See the error code table
        '409':
          description: 'Codes: `TWO_FACTOR_NOT_ENABLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TWO_FACTOR_NOT_ENABLED
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/2fa/backup-codes:
    get:
      tags:
      - auth
      operationId: getBackupCodesRemaining
      summary: How many backup codes are left
      description: Never returns the codes themselves (the server only keeps keyed hashes). Lets the app tell the user to make new ones before they run out.
      x-status: implemented
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/BackupCodesRemaining'
        '409':
          description: 'Codes: `TWO_FACTOR_NOT_ENABLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TWO_FACTOR_NOT_ENABLED
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
      - auth
      operationId: regenerateBackupCodes
      summary: Make new backup codes
      description: "Replaces the whole list: the old codes, used or not, stop working. Needs a valid code (the app's 6 digits or a backup code) so a stolen session cannot reset them. Rate limit: 5 per minute."
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorOrBackupCodeRequest'
      responses:
        '200':
          description: The 10 new codes, shown only this once
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/BackupCodes'
        '400':
          description: 'Codes: `VALIDATION_ERROR`, `INVALID_2FA_CODE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_2FA_CODE
                  message: See the error code table
        '409':
          description: 'Codes: `TWO_FACTOR_NOT_ENABLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TWO_FACTOR_NOT_ENABLED
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /matches:
    post:
      tags:
      - matches
      operationId: createMatch
      summary: Create a match
      description: 'Creates a `waiting` match and puts the caller in it, in seat 1 or 2 chosen at random. With `opponentDisplayName`
        only that player can join; otherwise anyone who has the match id can. The computer opponents are players too: `opponentDisplayName: "AI_Hard"` makes the server join and answer every move by itself. Rate limit: 20 per minute. Inviting a player
        who blocked you, or whom you blocked, answers `BLOCKED`.'
      x-status: implemented
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchRequest'
      responses:
        '201':
          description: The new match
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Match'
        '400':
          description: 'Codes: `VALIDATION_ERROR`, `CANNOT_INVITE_SELF`, `INVALID_SETTINGS`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: See the error code table
        '403':
          description: 'The invited player blocked you, or you blocked them. Codes: `BLOCKED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BLOCKED
                  message: See the error code table
        '404':
          description: 'No player has this display name. Codes: `USER_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: USER_NOT_FOUND
                  message: See the error code table
        '409':
          description: 'Three matches already wait for an opponent. Codes: `TOO_MANY_WAITING_MATCHES`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TOO_MANY_WAITING_MATCHES
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /matches/mine:
    get:
      tags:
      - matches
      operationId: listMyMatches
      summary: My matches
      description: The matches the caller plays or played, newest first. Declare this route BEFORE `/matches/{id}`.
      x-status: implemented
      parameters:
      - name: status
        in: query
        required: false
        description: Only matches in this state
        schema:
          type: string
          enum:
          - waiting
          - in_progress
          - finished
          - abandoned
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MatchSummaryPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /matches/live:
    get:
      tags:
      - matches
      operationId: listLiveMatches
      summary: Matches being played now
      description: Every `in_progress` match, most recently started first. `yourSeat` is the viewer's seat in the
        matches they play, null in the others. The Watch page lists these, then opens one with `GET /matches/{id}`.
        Declare this route BEFORE `/matches/{id}`.
      x-status: implemented
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MatchSummaryPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /matches/{id}:
    get:
      tags:
      - matches
      operationId: getMatch
      summary: One match
      description: 'Any logged-in user can read any match (spectator mode): `yourSeat` is null for someone who does not
        play it. Joining, moving and resigning stay for the players only. This also removes the 404 (a red line in the
        console) a player got when opening a shared match link before joining.'
      x-status: implemented
      parameters:
      - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Match'
        '404':
          description: 'Codes: `MATCH_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: MATCH_NOT_FOUND
                  message: See the error code table
        '400':
          description: 'The id is not a UUID. Codes: `VALIDATION_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /matches/{id}/join:
    post:
      tags:
      - matches
      operationId: joinMatch
      summary: Join a waiting match
      description: Takes the free seat and starts the match. The match row is locked, so of several simultaneous
        joiners exactly one gets in.
      x-status: implemented
      parameters:
      - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: The match, now `in_progress`
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Match'
        '403':
          description: 'The match is reserved for another player. Codes: `NOT_INVITED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_INVITED
                  message: See the error code table
        '404':
          description: 'Codes: `MATCH_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: MATCH_NOT_FOUND
                  message: See the error code table
        '409':
          description: 'Codes: `MATCH_NOT_JOINABLE`, `ALREADY_IN_MATCH`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: MATCH_NOT_JOINABLE
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /matches/{id}/moves:
    post:
      tags:
      - matches
      operationId: playMove
      summary: Play a move
      description: The server judges the move with the engine (the browser never decides a result). Locked, so two
        simultaneous moves cannot both be stored.
      x-status: implemented
      parameters:
      - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeMoveRequest'
      responses:
        '200':
          description: The whole updated match
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Match'
        '400':
          description: 'Codes: `VALIDATION_ERROR`, `INVALID_COLUMN`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: See the error code table
        '404':
          description: 'Codes: `MATCH_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: MATCH_NOT_FOUND
                  message: See the error code table
        '409':
          description: 'Codes: `NOT_YOUR_TURN`, `COLUMN_FULL`, `MATCH_NOT_ACTIVE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_YOUR_TURN
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /matches/{id}/resign:
    post:
      tags:
      - matches
      operationId: resignMatch
      summary: Resign
      description: A running match ends with the opponent as winner. A match still waiting for an opponent is cancelled
        (`abandoned`).
      x-status: implemented
      parameters:
      - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Match'
        '404':
          description: 'Codes: `MATCH_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: MATCH_NOT_FOUND
                  message: See the error code table
        '409':
          description: 'Codes: `MATCH_NOT_ACTIVE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: MATCH_NOT_ACTIVE
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users:
    get:
      tags:
      - users
      operationId: searchPlayers
      summary: Search players
      description: 'The viewer is in the results too, with `friendship: self`. The Players page keeps the filters
        in its URL and sends the search 300 ms after the last key press.'
      x-status: implemented
      parameters:
      - name: search
        in: query
