                  message: See the error code table
        '409':
          description: 'Codes: `NOT_JOINED`, `CREATOR_CANNOT_LEAVE`, `TOURNAMENT_NOT_OPEN`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_JOINED
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /tournaments/{id}/start:
    post:
      tags:
      - tournaments
      operationId: startTournament
      summary: Start before it is full
      description: 'Creator only, with at least 3 players (`NOT_ENOUGH_PLAYERS` otherwise). Taking the last place also starts the
        tournament, with the same rules. At the start the players are shuffled into a bracket of the next power of two (4 for
        3 or 4 players, 8 for 5 to 8). The empty places are byes, one per first-round pairing, and a player with a bye
        goes straight to round 2. As soon as both players of a pairing are known the server creates their match: both
        seated, `in_progress` at once, seats at random, the tournament''s settings; it sets the pairing''s `matchId`.
        The winner of pairing `i` in round `r` moves to pairing `floor(i/2)` of round `r+1`, in place `i % 2`. A draw is
        replayed with a new match. When the final has a winner the tournament is `finished`. Every change sends
        `tournament:update`. In a tournament match the player whose turn it is loses if no move is made for
        `TOURNAMENT_TURN_TIMEOUT_SECONDS` (180 by default); the loss is recorded as `endReason: disconnect`.
        Not built yet: the `system` chat message (`event: tournament_match`), which waits for chat.'
      x-status: implemented
      parameters:
      - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tournament'
        '403':
          description: 'Codes: `NOT_CREATOR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_CREATOR
                  message: See the error code table
        '404':
          description: 'Codes: `TOURNAMENT_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: TOURNAMENT_NOT_FOUND
                  message: See the error code table
        '409':
          description: 'Codes: `NOT_ENOUGH_PLAYERS`, `TOURNAMENT_NOT_OPEN`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_ENOUGH_PLAYERS
                  message: See the error code table
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: 'httpOnly cookie set by signup, login and 2FA verify. The browser sends it by itself: use `credentials:
        "include"`.'
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Offset:
      name: offset
      in: query
      description: How many items to skip
      schema:
        type: integer
        minimum: 0
        default: 0
    MatchId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TournamentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: The OTHER player
      schema:
        type: string
        format: uuid
    DisplayName:
      name: displayName
      in: path
      required: true
      description: 'Matched exactly, as stored (case-sensitive). Note: nothing stops a player from choosing the
        name `me`; the routes under `/users/me` are fixed paths and do not clash.'
      schema:
        type: string
  responses:
    Unauthorized:
      description: 'No valid session: the app goes back to the login page. Code `UNAUTHORIZED`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: 'No valid session: the app goes back to the login page. Code `UNAUTHORIZED`.'
    ValidationError:
      description: A body or query breaks a rule. Code `VALIDATION_ERROR`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: A body or query breaks a rule. Code `VALIDATION_ERROR`.
    RateLimited:
      description: Too many requests. Code `RATE_LIMITED`; `Retry-After` says when.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests. Code `RATE_LIMITED`; `Retry-After` says when.
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: English explanation, a fallback for codes the client does not translate
          required:
          - code
          - message
      required:
      - error
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - RATE_LIMITED
      - INTERNAL_ERROR
      - INVALID_CREDENTIALS
      - EMAIL_TAKEN
      - DISPLAY_NAME_TAKEN
      - INVALID_2FA_CODE
      - TWO_FACTOR_ALREADY_ENABLED
      - TWO_FACTOR_NOT_ENABLED
      - TWO_FACTOR_NOT_PENDING
      - USER_NOT_FOUND
      - CANNOT_INVITE_SELF
      - INVALID_SETTINGS
      - TOO_MANY_WAITING_MATCHES
      - MATCH_NOT_FOUND
      - MATCH_NOT_JOINABLE
      - ALREADY_IN_MATCH
      - NOT_INVITED
      - MATCH_NOT_ACTIVE
      - NOT_YOUR_TURN
      - COLUMN_FULL
      - INVALID_COLUMN
      - BLOCKED
      - CANNOT_FRIEND_SELF
      - INVALID_INVITE
      - AVATAR_INVALID_TYPE
      - AVATAR_TOO_LARGE
      - TOURNAMENT_NOT_FOUND
      - TOURNAMENT_NOT_OPEN
      - TOURNAMENT_FULL
      - ALREADY_JOINED
      - NOT_JOINED
      - CREATOR_CANNOT_LEAVE
      - NOT_CREATOR
      - NOT_ENOUGH_PLAYERS
      description: Stable identifier of a failure. The frontend translates it (English, French, Arabic). Every code
        a route can answer is listed on the route.
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          description: 3 to 20 letters of any language, digits, `_` or `-`; unique, case-sensitive
        avatarUrl:
          type: string
          description: 'Path under /api, for example `/api/avatars/<file>`. null: the app draws a default avatar'
          nullable: true
        locale:
          type: string
          enum:
          - en
          - fr
          - ar
        twoFactorEnabled:
          type: boolean
          description: NEW, optional. Lets the account page show only the button that applies
      required:
      - id
      - email
      - displayName
      - avatarUrl
      - locale
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased by the server
        displayName:
          type: string
          minLength: 3
          maxLength: 20
          description: Letters of any language, digits, `_` and `-`
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
      required:
      - email
      - displayName
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          format: password
      required:
      - email
      - password
    TwoFactorCodeRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^\d{6}$
          description: 6 digits. Spaces are removed before the check
      required:
      - code
    TwoFactorOrBackupCodeRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^(\d{6}|[0-9A-Za-z]{5}-?[0-9A-Za-z]{5})$
          description: The 6 digits of the authenticator app, or a one-time backup code such as `ABCDE-FGHJK` (spaces and case are ignored)
      required:
      - code
    BackupCodes:
      type: object
      properties:
        backupCodes:
          type: array
          items:
            type: string
          description: 10 one-time codes like `ABCDE-FGHJK`, shown ONLY this once. Each works once, in place of the 6-digit code
      required:
      - backupCodes
    BackupCodesRemaining:
      type: object
      properties:
        remaining:
          type: integer
          description: Backup codes not used yet
      required:
      - remaining
    SessionResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
      required:
      - user
    LoginResult:
      oneOf:
      - type: object
        properties:
          user:
            $ref: '#/components/schemas/User'
        required:
        - user
      - type: object
        properties:
          user:
            type: object
            nullable: true
            example: null
          twoFactorRequired:
            type: boolean
            enum:
            - true
        required:
        - user
        - twoFactorRequired
        description: The password was right but a 2FA code is needed. The user is NOT logged in yet.
    TwoFactorSetup:
      type: object
      properties:
        qr:
          type: string
          description: QR code image as a data URL, for an <img>
        secret:
          type: string
          description: The same secret as text, for manual entry in an authenticator app
      required:
      - qr
      - secret
    MatchSettings:
      type: object
      properties:
        cols:
          type: integer
          minimum: 5
          maximum: 10
        rows:
          type: integer
          minimum: 5
          maximum: 9
        winLength:
          type: integer
          minimum: 3
          maximum: 5
          description: Never more than the smaller board side
        theme:
          type: string
          enum:
          - classic
          - ocean
          - sunset
          - midnight
      required:
      - cols
      - rows
      - winLength
      - theme
    MatchSettingsInput:
      type: object
      properties:
        cols:
          type: integer
          minimum: 5
          maximum: 10
        rows:
          type: integer
          minimum: 5
          maximum: 9
        winLength:
          type: integer
          minimum: 3
          maximum: 5
        theme:
          type: string
          enum:
          - classic
          - ocean
          - sunset
          - midnight
      description: Every field is optional; missing ones use the classic 7 x 6, four in a row, classic theme.
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        online:
          type: boolean
          description: Has at least one open socket (or, before sockets exist, a request in the last minute)
      required:
      - id
      - displayName
      - avatarUrl
      - online
    PlayerRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
      required:
      - id
      - displayName
    Friendship:
      type: string
      enum:
      - self
      - none
      - friends
      - request_sent
      - request_received
      description: How the viewer relates to another player
    ProfileStats:
      type: object
      properties:
        played:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        draws:
          type: integer
      required:
      - played
      - wins
      - losses
      - draws
      description: Finished matches only (abandoned ones do not count). played = wins + losses + draws.
    PlayerListItem:
      allOf:
      - $ref: '#/components/schemas/UserSummary'
      - type: object
        properties:
          createdAt:
            type: string
            format: date-time
            description: ISO 8601, UTC
          stats:
            $ref: '#/components/schemas/ProfileStats'
          friendship:
            $ref: '#/components/schemas/Friendship'
          isBot:
            type: boolean
            description: A computer opponent (AI_Easy, AI_Medium, AI_Hard), not a person. Always online, cannot log in.
        required:
        - isBot
        - createdAt
        - stats
        - friendship
    Profile:
      allOf:
      - $ref: '#/components/schemas/UserSummary'
      - type: object
        properties:
          createdAt:
            type: string
            format: date-time
            description: ISO 8601, UTC
          lastSeenAt:
            type: string
            format: date-time
            description: When they were last online; null while online
            nullable: true
          stats:
            $ref: '#/components/schemas/ProfileStats'
          friendship:
            $ref: '#/components/schemas/Friendship'
          blocked:
            type: boolean
            description: The viewer blocked this player
          isBot:
            type: boolean
            description: A computer opponent (AI_Easy, AI_Medium, AI_Hard), not a person
        required:
        - isBot
        - createdAt
        - lastSeenAt
        - stats
        - friendship
        - blocked
    ProfileMatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        opponent:
          $ref: '#/components/schemas/PlayerRef'
        result:
          type: string
          enum:
          - win
          - loss
          - draw
        settings:
          $ref: '#/components/schemas/MatchSettings'
        endedAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
        moveCount:
          type: integer
      required:
      - id
      - opponent
      - result
      - settings
      - endedAt
      - moveCount
      description: A finished match, seen from the profile owner's side
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 3
          maxLength: 20
          description: Same rules as signup
      required:
      - displayName
    Position:
      type: object
      properties:
        col:
          type: integer
        row:
          type: integer
      required:
      - col
      - row
    MatchPlayer:
      type: object
      properties:
        seat:
          type: integer
          enum:
          - 1
          - 2
          description: Seat 1 plays first
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        result:
          type: string
          enum:
          - win
          - loss
          - draw
          description: null until the match is over
          nullable: true
      required:
      - seat
      - userId
      - displayName
      - result
    MatchGame:
      type: object
      properties:
        board:
          type: array
          items:
            type: array
            items:
              type: integer
              enum:
              - 0
              - 1
              - 2
          description: '`board[col][row]`: first index the COLUMN, `row 0` is the BOTTOM. 0 empty, 1 and 2 the seats'
        current:
          type: integer
          enum:
          - 1
          - 2
          description: Whose turn it is; null unless in progress
          nullable: true
        lastMove:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Position'
        winningLine:
          type: array
          items:
            $ref: '#/components/schemas/Position'
          description: The connected discs to highlight
          nullable: true
        moveCount:
          type: integer
        moves:
          type: array
          items:
            type: integer
          description: The columns played, in order
      required:
      - board
      - current
      - lastMove
      - winningLine
      - moveCount
      - moves
    Match:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - waiting
          - in_progress
          - finished
          - abandoned
        endReason:
          type: string
          enum:
          - win
          - draw
          - resign
          - disconnect
          nullable: true
        settings:
          $ref: '#/components/schemas/MatchSettings'
        createdAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        players:
          type: array
          items:
            $ref: '#/components/schemas/MatchPlayer'
          description: Ordered by seat
        yourSeat:
          type: integer
          enum:
          - 1
          - 2
          description: null when the viewer is not a player (a spectator)
          nullable: true
        winnerSeat:
          type: integer
          enum:
          - 1
          - 2
          description: Read from the players' results; also covers a resignation
          nullable: true
        game:
          $ref: '#/components/schemas/MatchGame'
      required:
      - id
      - status
      - endReason
      - settings
      - createdAt
      - startedAt
      - endedAt
      - players
      - yourSeat
      - winnerSeat
      - game
    MatchSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - waiting
          - in_progress
          - finished
          - abandoned
        endReason:
          type: string
          enum:
          - win
          - draw
          - resign
          - disconnect
          nullable: true
        settings:
          $ref: '#/components/schemas/MatchSettings'
        createdAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
        endedAt:
          type: string
          format: date-time
          nullable: true
        players:
          type: array
          items:
            $ref: '#/components/schemas/MatchPlayer'
        yourSeat:
          type: integer
          enum:
          - 1
          - 2
          nullable: true
        winnerSeat:
          type: integer
          enum:
          - 1
          - 2
          nullable: true
        moveCount:
          type: integer
      required:
      - id
      - status
      - endReason
      - settings
      - createdAt
      - endedAt
      - players
      - yourSeat
      - winnerSeat
      - moveCount
      description: 'A row of a match list: a Match without `game`, with its number of moves'
    CreateMatchRequest:
      type: object
      properties:
        settings:
          $ref: '#/components/schemas/MatchSettingsInput'
        opponentDisplayName:
          type: string
          minLength: 3
          maxLength: 20
          description: Reserve the match for this player. Omit for a match anyone with the link can join. Use `AI_Easy`, `AI_Medium` or `AI_Hard` to play the computer (online, over the same match routes).
    MakeMoveRequest:
      type: object
      properties:
        col:
          type: integer
          minimum: 0
          maximum: 11
          description: The column, from 0 on the left (the engine checks it against the real board)
      required:
      - col
    MatchSummaryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MatchSummary'
        total:
          type: integer
          description: Every matching item, for the page count
        limit:
          type: integer
        offset:
          type: integer
      required:
      - items
      - total
      - limit
      - offset
    PlayerListItemPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlayerListItem'
        total:
          type: integer
          description: Every matching item, for the page count
        limit:
          type: integer
        offset:
          type: integer
      required:
      - items
      - total
      - limit
      - offset
    ProfileMatchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProfileMatch'
        total:
          type: integer
          description: Every matching item, for the page count
        limit:
          type: integer
        offset:
          type: integer
      required:
      - items
      - total
      - limit
      - offset
    TournamentSummaryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TournamentSummary'
        total:
          type: integer
          description: Every matching item, for the page count
        limit:
          type: integer
        offset:
          type: integer
      required:
      - items
      - total
      - limit
      - offset
    Friend:
      allOf:
      - $ref: '#/components/schemas/UserSummary'
      - type: object
        properties:
          since:
            type: string
            format: date-time
            description: ISO 8601, UTC
        required:
        - since
    FriendsOverview:
      type: object
      properties:
        friends:
          type: array
          items:
            $ref: '#/components/schemas/Friend'
          description: Online first, then by name
        incoming:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          description: Requests other players sent to the viewer
        outgoing:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
          description: Requests the viewer sent, not answered yet
      required:
      - friends
      - incoming
      - outgoing
    FriendshipResult:
      type: object
      properties:
        friendship:
          $ref: '#/components/schemas/Friendship'
      required:
      - friendship
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
          nullable: true
        kind:
          type: string
          enum:
          - text
          - invite
          - system
        body:
          type: string
          maxLength: 500
          description: The text; empty for invites and system messages
        matchId:
          type: string
          format: uuid
          nullable: true
        tournamentId:
          type: string
          format: uuid
          nullable: true
        event:
          type: string
          enum:
          - tournament_match
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
      required:
      - id
      - senderId
      - kind
      - body
      - matchId
      - tournamentId
      - event
      - createdAt
      description: '`text`: written by a player (1 to 500 characters). `invite`: an invitation to a match the sender
        created for the peer. `system`: written by the server (`event: tournament_match` = "your tournament match
        is ready"); `senderId` is null.'
    Conversation:
      type: object
      properties:
        peer:
          $ref: '#/components/schemas/UserSummary'
        lastMessage:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Message'
        unread:
          type: integer
          description: Messages from the peer the viewer has not read
        peerReadAt:
          type: string
          format: date-time
          description: The peer read the viewer's messages up to this time
          nullable: true
        blocked:
          type: boolean
          description: The viewer blocked the peer
      required:
      - peer
      - lastMessage
      - unread
      - peerReadAt
      - blocked
    MessagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Oldest first
        hasMore:
          type: boolean
          description: 'Older messages exist: ask again with `before` = the id of the oldest one'
        peerReadAt:
          type: string
          format: date-time
          nullable: true
      required:
      - items
      - hasMore
      - peerReadAt
    SendMessageRequest:
      type: object
      description: Send `body` for a text message, OR `matchId` for an invitation. Exactly one of them.
      minProperties: 1
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 500
          description: Trimmed, 1 to 500 characters
        matchId:
          type: string
          format: uuid
          description: A match that is `waiting`, was created by the sender and is reserved for this player
    ReadResult:
      type: object
      properties:
        readAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
      required:
      - readAt
    TournamentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
          - registering
          - running
          - finished
        size:
          type: integer
          enum:
          - 4
          - 8
          description: Places
        playerCount:
          type: integer
        settings:
          $ref: '#/components/schemas/MatchSettings'
        createdBy:
          $ref: '#/components/schemas/PlayerRef'
        createdAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
        winner:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/PlayerRef'
        joined:
          type: boolean
          description: The viewer is registered
      required:
      - id
      - name
      - status
      - size
      - playerCount
      - settings
      - createdBy
      - createdAt
      - winner
      - joined
    Pairing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        players:
          type: array
          minItems: 2
          maxItems: 2
          items:
            nullable: true
            allOf:
            - $ref: '#/components/schemas/UserSummary'
          description: 'Exactly two places. null: waiting for the winner of an earlier pairing, or empty (bye)'
        matchId:
          type: string
          format: uuid
          nullable: true
        winnerId:
          type: string
          format: uuid
          nullable: true
        bye:
          type: boolean
          description: One player had no opponent and went through without playing
      required:
      - id
      - players
      - matchId
      - winnerId
      - bye
    Round:
      type: object
      properties:
        pairings:
          type: array
          items:
            $ref: '#/components/schemas/Pairing'
      required:
      - pairings
    Tournament:
      allOf:
      - $ref: '#/components/schemas/TournamentSummary'
      - type: object
        properties:
          players:
            type: array
            items:
              $ref: '#/components/schemas/UserSummary'
            description: In order of registration
          rounds:
            type: array
            items:
              $ref: '#/components/schemas/Round'
            description: Empty until the start. `rounds[0]` is the first round
          startedAt:
            type: string
            format: date-time
            nullable: true
          endedAt:
            type: string
            format: date-time
            nullable: true
        required:
        - players
        - rounds
        - startedAt
        - endedAt
    CreateTournamentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 30
          description: Trimmed. Letters, digits, spaces and `- _ ' .`, starting with a letter or a digit
        size:
          type: integer
          enum:
          - 4
          - 8
        settings:
          $ref: '#/components/schemas/MatchSettingsInput'
      required:
      - name
      - size
    RtMatchWatch:
      type: object
      properties:
        matchId:
          type: string
          format: uuid
      required:
      - matchId
    RtChatMessage:
      type: object
      properties:
        peerId:
          type: string
          format: uuid
          description: The OTHER player, as seen by the receiver
        message:
          $ref: '#/components/schemas/Message'
      required:
      - peerId
      - message
    RtChatTyping:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: The one who is typing
      required:
      - userId
    RtChatRead:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: The one who read
        readAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
      required:
      - userId
      - readAt
    RtPresence:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        online:
          type: boolean
      required:
      - userId
      - online
    RtEmpty:
      type: object
      description: No fields
      properties: {}
    RtTournamentUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
x-realtime:
  description: 'Live updates over Socket.IO. They are HINTS: the app also polls, so a missed event only delays an
    update. The frontend uses them when built with `VITE_REALTIME=socket`; polling then slows to every 30 s. Built: the connection, `match:*`, `presence`, `friends:update`, `tournament:update`
    (`x-status: implemented`). A player whose last socket closes has `DISCONNECT_GRACE_SECONDS` (30) to reconnect, otherwise they lose the running match (`endReason: disconnect`). Not built yet: the `chat:*` events.'
  connection:
    library: Socket.IO v4
    url: 'Same origin as the app, path `/socket.io`, WebSocket transport only: `io({ withCredentials: true, transports:
      ["websocket"] })`'
    authentication: The browser sends the `session` cookie with the handshake. Check it there and refuse the connection
      without a valid (non-pending) session.
    rooms: Put every socket in the room `user:<id>` so an event reaches every tab of that user. `match:watch` adds
      it to the room of that match.
    reconnection: 'After a reconnection the server has forgotten the watched matches: the app sends `match:watch`
      again.'
  clientToServer:
    match:watch:
      x-status: implemented
      payload:
        $ref: '#/components/schemas/RtMatchWatch'
      does: Adds the socket to the room of that match (players and spectators alike).
    match:unwatch:
      x-status: implemented
      payload:
        $ref: '#/components/schemas/RtMatchWatch'
      does: Removes it.
  serverToClient:
    match:update:
      x-status: implemented
      payload:
        $ref: '#/components/schemas/Match'
      sentTo: The room of the match
      when: 'Every change: join, move, resignation, end. One payload for the whole room: `yourSeat` in it is ignored,
        the app keeps the seat from its own `GET /matches/{id}`.'
    chat:message:
      x-status: new
      payload:
        $ref: '#/components/schemas/RtChatMessage'
      sentTo: Both players
      when: A message is sent (so the sender's other tabs see it too).
    chat:typing:
      x-status: new
      payload:
        $ref: '#/components/schemas/RtChatTyping'
      sentTo: The other player
      when: After `POST /chat/{userId}/typing`.
    chat:read:
      x-status: new
      payload:
        $ref: '#/components/schemas/RtChatRead'
      sentTo: The other player
      when: After `POST /chat/{userId}/read`.
    presence:
      x-status: implemented
      payload:
        $ref: '#/components/schemas/RtPresence'
      sentTo: Everyone, or at least friends and chat peers
      when: A user's first socket connects, or their last one disconnects. Set `lastSeenAt` when the last one goes.
    friends:update:
      x-status: implemented
      payload:
        $ref: '#/components/schemas/RtEmpty'
      sentTo: Both players
      when: A friend request is sent, accepted, declined or cancelled, a friend is removed, or a block ends a friendship.
    tournament:update:
      x-status: implemented
      payload:
        $ref: '#/components/schemas/RtTournamentUpdate'
      sentTo: Everyone
      when: Registration, start, a result, a new match, the end, a cancellation.
