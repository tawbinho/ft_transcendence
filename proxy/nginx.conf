# Upgrade WebSocket connections (Socket.io) instead of treating them as plain
# requests: "Upgrade" requests keep the connection open, everything else closes.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    # Only modern TLS versions.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Room for uploads (avatars) later.
    client_max_body_size 5m;

    # Docker's built-in DNS. With a variable in proxy_pass, nginx looks the
    # backend up again at request time, so it keeps working when the backend
    # container is recreated with a new address (nginx would otherwise
    # remember the old one forever).
    resolver 127.0.0.11 valid=5s;

    location / {
        set $backend http://backend:3000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The REAL client address. It OVERWRITES any X-Forwarded-For sent by
        # the client, so nobody can spoof their address to dodge the rate
        # limits. The backend trusts exactly one proxy hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Tells the backend the original request was HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A game socket may stay quiet for a while: do not cut it after 60 s.
        proxy_read_timeout 1h;
    }
}
