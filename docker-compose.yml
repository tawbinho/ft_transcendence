services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - internal
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      AVATAR_DIR: /data/avatars
      # Gmail sending of verification emails; empty SMTP_USER = link only in the log.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Optional, with these defaults: how long a login lasts (in days), how
      # long a tournament player may take to move, and how long a player may be
      # disconnected from a running match.
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      TOURNAMENT_TURN_TIMEOUT_SECONDS: ${TOURNAMENT_TURN_TIMEOUT_SECONDS:-180}
      DISCONNECT_GRACE_SECONDS: ${DISCONNECT_GRACE_SECONDS:-30}
    # Not published to the host on purpose: the only way in from outside is
    # the HTTPS proxy below (the subject requires HTTPS for every connection
    # to the backend). `expose` only makes the port visible to other
    # containers of this compose network.
    expose:
      - '3000'
    networks:
      - internal
      # Only for outbound SMTP (Gmail); nothing is published from here.
      - edge
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Profile pictures: kept between restarts, not inside the source tree.
      - avatar-data:/data/avatars

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - internal

  # HTTPS entry point: decrypts HTTPS and forwards to the backend over plain
  # HTTP inside the network. See proxy/nginx.conf.
  proxy:
    build: ./proxy
    restart: unless-stopped
    ports:
      # Port 8443 and not 443: rootless Docker cannot bind ports below 1024.
      - '${HTTPS_PORT}:443'
    networks:
      # edge: a container only on an internal network cannot publish ports.
      - edge
      - internal
    depends_on:
      - backend
      - frontend
    volumes:
      # Keeps the self-signed certificate between restarts.
      - proxy-certs:/etc/nginx/certs

volumes:
  db-data:
  avatar-data:
  proxy-certs:

networks:
  # No gateway: nothing on it can be reached from outside or reach the internet.
  internal:
    internal: true
  edge:
