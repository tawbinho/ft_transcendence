services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      TWO_FACTOR_KEY: ${TWO_FACTOR_KEY}
      AVATAR_DIR: /data/avatars
    # Not published to the host on purpose: the only way in from outside is
    # the HTTPS proxy below (the subject requires HTTPS for every connection
    # to the backend). `expose` only makes the port visible to other
    # containers of this compose network.
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Profile pictures: kept between restarts, not inside the source tree.
      - avatar-data:/data/avatars

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO_FEATURES: users,friends,chat,spectate,tournaments
    restart: unless-stopped
    expose:
      - '80'

  # HTTPS entry point: decrypts HTTPS and forwards to the backend over plain
  # HTTP inside the network. See proxy/nginx.conf.
  proxy:
    build: ./proxy
    restart: unless-stopped
    ports:
      # Port 8443 and not 443: rootless Docker cannot bind ports below 1024.
      - '${HTTPS_PORT}:443'
    depends_on:
      - backend
      - frontend
    volumes:
      # Keeps the self-signed certificate between restarts.
      - proxy-certs:/etc/nginx/certs

volumes:
  db-data:
  avatar-data:
  proxy-certs:
